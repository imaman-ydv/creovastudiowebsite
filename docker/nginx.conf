server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;
    resolver ${DNS_RESOLVER} valid=30s ipv6=off;

    location /api/ {
        proxy_pass ${API_SCHEME}://${API_HOST}/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 180s;
    }

    location /admin/ {
        proxy_pass ${API_SCHEME}://${API_HOST}/admin/;
        proxy_ssl_server_name on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 180s;
    }

    location /static/ {
        proxy_pass ${API_SCHEME}://${API_HOST}/static/;
        proxy_ssl_server_name on;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /media/ {
        proxy_pass ${API_SCHEME}://${API_HOST}/media/;
        proxy_ssl_server_name on;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        add_header X-Content-Type-Options nosniff always;
        proxy_read_timeout 180s;
    }

    location = /portfolio {
        return 301 /portfolio/;
    }

    location /portfolio/ {
        proxy_pass ${PORTFOLIO_SCHEME}://${PORTFOLIO_HOST}/;
        proxy_ssl_server_name on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 180s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
