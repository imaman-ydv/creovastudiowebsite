databases:
  - name: creova-test-db
    databaseName: creova_test
    user: creova_test
    plan: free
    region: singapore

services:
  - type: web
    name: creova-test-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/pages/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: DB_ENGINE
        value: postgresql
      - key: DATABASE_URL
        fromDatabase:
          name: creova-test-db
          property: connectionString
      - key: WEB_CONCURRENCY
        value: "1"
      - key: DJANGO_SUPERUSER_USERNAME
        value: creova_admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: studiocreova@gmail.com
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

  - type: web
    name: creova-test-portfolio
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./personal-portfolio/Dockerfile
    dockerContext: ./personal-portfolio
    healthCheckPath: /health

  - type: web
    name: creova-test-site
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: API_SCHEME
        value: https
      - key: API_HOST
        fromService:
          name: creova-test-backend
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: PORTFOLIO_SCHEME
        value: https
      - key: PORTFOLIO_HOST
        fromService:
          name: creova-test-portfolio
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: DNS_RESOLVER
        value: 8.8.8.8
